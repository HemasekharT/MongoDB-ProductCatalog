name: Full Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  PROJECT_ID: elegant-verbena-480615-a4
  REGION: us-central1

permissions:
  contents: read
  id-token: write  # Required for called workflows

jobs:
  deploy-backend:
    name: Deploy Backend
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  
  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-backend
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  
  summary:
    name: Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Print Deployment URLs
        run: |
          echo "🎉 Deployment Complete!"
          echo ""
          echo "📊 Deployed Services:"
          echo "  Backend:  ${{ needs.deploy-backend.outputs.backend-url }}"
          echo "  Frontend: ${{ needs.deploy-frontend.outputs.frontend-url }}"
          echo ""
          echo "✅ All services deployed successfully!"
